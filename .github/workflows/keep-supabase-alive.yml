name: Keep Supabase Alive

# Supabase 免費方案閒置約 7 天會自動暫停專案。
# 每 3 天打一次真正會查資料庫的 RPC，讓專案保持活躍。
on:
  schedule:
    # UTC 01:17 = 台灣 09:17；避開整點，GitHub 整點排程常延遲或被略過
    - cron: '17 1 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 呼叫 get_global_leaderboard（anon 可執行，會實際查詢 Postgres）
        env:
          # 與 deploy.yml 共用 repo 的 Actions Variables
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY 變數"
            exit 1
          fi

          # 專案若已被暫停，網域會解析不到，curl 失敗 → workflow 失敗 → GitHub 寄信通知
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_global_leaderboard" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase 回應異常"
            cat response.json
            exit 1
          fi
          echo "Supabase 正常運作"
